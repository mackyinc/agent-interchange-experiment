server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 159.89.82.134;
    server_tokens off;
    client_max_body_size 64k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location = /observer { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location ^~ /observer/ { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location / { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 159.89.82.134;
    server_tokens off;
    client_max_body_size 64k;
    ssl_certificate /etc/letsencrypt/live/agent-interchange-ipv4-ipv6/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-interchange-ipv4-ipv6/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; try_files $uri =404; }
    location = /observer { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location ^~ /observer/ { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location / { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
}

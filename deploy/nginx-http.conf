server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 159.89.82.134;
    server_tokens off;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /observer { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location ^~ /observer/ { auth_basic "Agent Node Observer"; auth_basic_user_file /etc/nginx/agent-interchange.htpasswd; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
    location / { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/agent-interchange-proxy.conf; }
}

